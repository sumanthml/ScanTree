name: 400 Load Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  load-tests:
    runs-on: ubuntu-latest
    name: Run 400 Load Test Cases

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl requests httpx

    - name: Run 400 Load Test Cases
      run: |
        python tests/load_test_suite.py

    - name: Publish Summary to GitHub Actions
      if: always()
      run: |
        python3 - <<'PYEOF'
        import json, os
        from datetime import datetime

        results_dir = "Test Results"
        results_path = os.path.join(results_dir, "load_results.json")
        results = json.load(open(results_path)) if os.path.exists(results_path) else []

        total  = len(results)
        passed = sum(1 for r in results if r["status"] == "Passed")
        failed = total - passed
        rate   = (passed/total*100) if total else 0
        icon   = "⚡" if rate == 100 else "⚠️"

        SUMMARY = os.environ["GITHUB_STEP_SUMMARY"]
        run_num = os.environ.get("GITHUB_RUN_NUMBER", "N/A")
        ts = datetime.now().strftime("%Y-%m-%d %H:%M:%S")

        with open(SUMMARY, "w") as f:
            f.write(f"# ⚡ ScanTrace — 400 Load Test Cases Report\n\n")
            f.write(f"> **Run:** #{run_num} | **Time:** {ts} | **Status:** {icon} All {passed}/{total} Passed\n\n")
            f.write("| Metric | Value |\n| :--- | :---: |\n")
            f.write(f"| 🔢 Total Load Scenarios | **{total}** |\n")
            f.write(f"| ✅ Passed | **{passed}** |\n")
            f.write(f"| ❌ Failed | **{failed}** |\n")
            f.write(f"| 📈 Pass Rate | **{rate:.2f}%** |\n")

        print("Load test summary written.")
        PYEOF

    - name: Upload Load Test Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: load-400-test-results
        path: |
          Test Results/HTML/load-report.html
          Test Results/Excel/Load_400_Tests.xlsx
          Test Results/load_results.json
