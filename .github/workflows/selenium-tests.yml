name: E2E Selenium Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # --- Setup Python & Backend ---
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install selenium pytest webdriver-manager

    - name: Start FastAPI backend server (SQLite mode)
      env:
        DATABASE_URL: sqlite:///./test.db
        SUPABASE_URL: https://mock-url.supabase.co
        SUPABASE_ANON_KEY: mock-key
        SUPABASE_SERVICE_ROLE_KEY: mock-key
        SUPABASE_BUCKET_NAME: mock-bucket
        FIREBASE_CREDENTIALS_JSON: '{"type": "service_account"}'
        GEMINI_API_KEY: mock-key
      run: |
        cd backend
        python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
        echo "Backend server started in the background"

    # --- Setup Node & Frontend ---
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Export Expo web build
      run: |
        cd frontend
        npx expo export --platform web

    - name: Serve frontend static site
      run: |
        # Serve the 'dist' build directory on port 8081 using Python's built-in HTTP server
        cd frontend
        python3 -m http.server 8081 --directory dist &
        echo "Frontend static server started in the background on port 8081"

    # --- Readiness Check ---
    - name: Wait for servers to be responsive
      run: |
        echo "Waiting for local servers to start up..."
        timeout 60s bash -c 'until curl -s http://localhost:8000/ > /dev/null; do sleep 2; done'
        timeout 60s bash -c 'until curl -s http://localhost:8081/ > /dev/null; do sleep 2; done'
        echo "Backend (port 8000) and Frontend (port 8081) are successfully responsive!"

    # --- Run Selenium Tests ---
    - name: Run Selenium E2E Tests
      run: |
        python tests/selenium_test.py

    # --- Upload Failures Screenshot ---
    - name: Upload screenshot on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: selenium-error-screenshot
        path: selenium_error_screenshot.png
